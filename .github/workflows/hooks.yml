name: hooks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile hooks and tests
        run: python -m compileall -q hooks tests

      - name: Run guard regression tests
        run: python -m unittest discover -s tests -v
